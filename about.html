<body>

  <header class="bg-success bg-opacity-50 text-black py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h4 m-0">Sobre Nosotros</h1>
      <nav>
      <a href="index.html" class="text-black mx-2 text-decoration-none">Inicio</a>
      <a href="galeria.html" class="text-black mx-2 text-decoration-none">Galería</a>
      <a href="detalles.html" class="text-black mx-2 text-decoration-none">Detalles</a>
      <a href="about.html" class="text-black mx-2 text-decoration-none">Sobre Nosotros</a>
      </nav>
  </div>
</header>

<main class="container my-5">
  <h2>Conoce al equipo detrás del proyecto</h2>
  <p>Somos estudiantes apasionados por el arte y la tecnología, que unimos nuestras habilidades para crear esta galería virtual interactiva.</p>

  <hr>

  <h3>Formulario de contacto</h3>
  <form id="contactForm" class="mt-4">
    <div class="mb-3">
      <label for="name" class="form-label">Nombre:</label>
      <input type="text" id="name" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Correo electrónico:</label>
      <input type="email" id="email" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="message" class="form-label">Mensaje:</label>
      <textarea id="message" rows="4" class="form-control" required></textarea>
    </div>
    <button type="submit" class="btn btn-success">Enviar</button>
    <div id="contactFeedback" class="mt-3"></div>
  </form>
</main>
    <footer class="bg-light text-center py-3">
        <div class="container">Galeria Interactiva - Diplomado</div>
    </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
